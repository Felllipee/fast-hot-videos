<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Fast Hot - Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#ff3366',
                        secondary: '#7000ff',
                        darkbg: '#0f172a',
                        cardbg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
    </style>
</head>

<body class="p-6">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
                Fast Hot Premium
            </h1>
            <p class="text-gray-400">Painel de Controle em Tempo Real</p>
        </div>
        <button onclick="speakStats()"
            class="bg-primary hover:bg-red-600 text-white px-4 py-2 rounded-full flex items-center gap-2 transition">
            🔊 Ouvir Resumo
        </button>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <!-- Card 1 -->
        <div class="glass-card p-6 border-l-4 border-green-500">
            <h3 class="text-gray-400 text-sm uppercase">Usuários Online</h3>
            <div class="flex items-end gap-2">
                <span id="active-users" class="text-4xl font-bold text-white">0</span>
                <span class="text-green-400 text-sm mb-1">● Agora</span>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="glass-card p-6 border-l-4 border-blue-500">
            <h3 class="text-gray-400 text-sm uppercase">Total Visitas</h3>
            <div class="flex items-end gap-2">
                <span id="total-requests" class="text-4xl font-bold text-white">0</span>
                <span class="text-blue-400 text-sm mb-1">↗ Hoje</span>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="glass-card p-6 border-l-4 border-purple-500">
            <h3 class="text-gray-400 text-sm uppercase">Tempo Online</h3>
            <div class="flex items-end gap-2">
                <span id="uptime" class="text-2xl font-bold text-white">0m</span>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="glass-card p-6 border-l-4 border-yellow-500">
            <h3 class="text-gray-400 text-sm uppercase">Banda Estimada</h3>
            <div class="flex items-end gap-2">
                <span id="bandwidth" class="text-2xl font-bold text-white">0 MB</span>
            </div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card p-6">
            <h3 class="text-xl font-semibold mb-4 text-gray-200">Tráfego (Última Hora)</h3>
            <canvas id="trafficChart"></canvas>
        </div>
        <div class="glass-card p-6 flex flex-col justify-center items-center">
            <h3 class="text-xl font-semibold mb-4 text-gray-200">Dispositivos</h3>
            <div class="w-64">
                <canvas id="deviceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let stats = { active_users: 0, total_requests: 0 };

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                stats = data;

                // Animate numbers
                document.getElementById('active-users').innerText = data.active_users;
                document.getElementById('total-requests').innerText = data.total_requests;

                // Format Uptime
                const uptimeMin = Math.floor(data.uptime_seconds / 60);
                document.getElementById('uptime').innerText = uptimeMin + " min";

                document.getElementById('bandwidth').innerText = data.bandwidth_estimate;

                updateCharts(data);

            } catch (error) {
                console.error("Erro ao buscar stats:", error);
            }
        }

        // --- Charts Setup ---
        const ctxTraffic = document.getElementById('trafficChart').getContext('2d');
        const trafficChart = new Chart(ctxTraffic, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Acessos',
                    data: [],
                    borderColor: '#7000ff',
                    backgroundColor: 'rgba(112, 0, 255, 0.2)',
                    fill: true,
                    tension: 0.4
                }, {
                    label: 'Usuários Ativos',
                    data: [],
                    borderColor: '#ff3366',
                    backgroundColor: 'rgba(255, 51, 102, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: true, labels: { color: 'white' } } },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: 'gray' } },
                    y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: 'gray' }, beginAtZero: true }
                }
            }
        });

        const ctxDevice = document.getElementById('deviceChart').getContext('2d');
        const deviceChart = new Chart(ctxDevice, {
            type: 'doughnut',
            data: {
                labels: ['Desconhecido'],
                datasets: [{
                    data: [100],
                    backgroundColor: ['#22d3ee'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, cutout: '70%' }
        });

        function updateCharts(data) {
            if (!data.history) return;

            // Process History for Chart
            const labels = data.history.map(h => {
                const date = new Date(h.timestamp * 1000);
                return date.getHours() + ':' + date.getMinutes().toString().padStart(2, '0');
            });
            const counts = data.history.map(h => h.count);
            const active = data.history.map(h => h.active || 0);

            trafficChart.data.labels = labels;
            trafficChart.data.datasets[0].data = counts;
            trafficChart.data.datasets[1].data = active;
            trafficChart.update();
        }

        // --- TTS Logic (Voice) ---
        function speakStats() {
            if (!stats) return;

            const text = `Olá chefe! O sistema está rodando a ${Math.floor(stats.uptime_seconds / 60)} minutos. 
                          Temos ${stats.active_users} usuários online agora e ${stats.total_requests} visitas totais. 
                          O tráfego está estável.`;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';

            // Try to find a female voice
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.lang.includes('pt') && (v.name.includes('Google') || v.name.includes('Luciana') || v.name.includes('Yara')));

            if (femaleVoice) utterance.voice = femaleVoice;

            utterance.rate = 1.1; // Slightly faster
            utterance.pitch = 1;

            window.speechSynthesis.speak(utterance);
        }

        // Auto-refresh every 5s
        setInterval(fetchStats, 5000);
        fetchStats();

        // Welcome messsage on first click (browsers block auto-play)
        let hasWelcomed = false;
        document.body.addEventListener('click', () => {
            if (!hasWelcomed) {
                // speakStats(); // Optional: Auto-speak on first click
                hasWelcomed = true;
            }
        }, { once: true });

    </script>
</body>

</html>
